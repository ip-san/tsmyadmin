name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        task: [typecheck, lint, test, quality]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: typecheck
        if: matrix.task == 'typecheck'
        run: bun run typecheck && bun run type-coverage
      - name: lint
        if: matrix.task == 'lint'
        run: bun run lint
      - name: test
        if: matrix.task == 'test'
        run: bun run test
      - name: quality
        if: matrix.task == 'quality'
        run: bun run knip && bun run circular && bun run cpd && bun run check:arch && bun run check:sql-safety && bun run docs:validate

  # The oldest and the newest server of each series that CI covers (docs/deployment.md holds the full matrix and
  # says which versions are only checked by hand); the versions between them share the same catalog surface, so
  # the two ends are what a change has to keep working.
  integration:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - mysql: 'mysql:8.0'
            postgres: 'postgres:14'
          - mysql: 'mysql:8.4'
            postgres: 'postgres:17'
    services:
      mysql:
        image: ${{ matrix.mysql }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tsmyadmin_test
          MYSQL_USER: tsmyadmin
          MYSQL_PASSWORD: tsmyadmin
        ports: ["13306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: ${{ matrix.postgres }}
        env:
          POSTGRES_USER: tsmyadmin
          POSTGRES_PASSWORD: tsmyadmin
          POSTGRES_DB: tsmyadmin_test
        ports: ["15433:5432"]
        options: >-
          --health-cmd "pg_isready -U tsmyadmin -d tsmyadmin_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Load fixtures
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client postgresql-client >/dev/null
          mysql -h 127.0.0.1 -P 13306 -uroot -proot < docker/fixtures/mysql/01-schema.sql
          PGPASSWORD=tsmyadmin psql -h 127.0.0.1 -p 15433 -U tsmyadmin -d tsmyadmin_test -v ON_ERROR_STOP=1 -f docker/fixtures/postgres/01-schema.sql
      - run: bun run test:integration

  # The MySQL adapter must also pass its conformance suite against MariaDB (mysql.user layout and its collation,
  # max_statement_time, sequences, packages…), on the LTS release as well as the current one.
  integration-mariadb:
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        mariadb: ['mariadb:10.11', 'mariadb:11']
    services:
      mariadb:
        image: ${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: tsmyadmin_test
          MARIADB_USER: tsmyadmin
          MARIADB_PASSWORD: tsmyadmin
        ports: ["13306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Load fixtures
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client >/dev/null
          mariadb -h 127.0.0.1 -P 13306 -uroot -proot < docker/fixtures/mysql/01-schema.sql
      # Conformance plus the API integration suite (program dumps restore through DELIMITER ;; on MariaDB too).
      - run: TEST_DIALECTS=mysql INTEGRATION=1 bunx vitest run --project adapter-integration --project api-integration packages/adapter/src/test/mysql.integration.test.ts apps/api/src/app.integration.test.ts

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tsmyadmin_test
          MYSQL_USER: tsmyadmin
          MYSQL_PASSWORD: tsmyadmin
        ports: ["13306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tsmyadmin
          POSTGRES_PASSWORD: tsmyadmin
          POSTGRES_DB: tsmyadmin_test
        ports: ["15433:5432"]
        options: >-
          --health-cmd "pg_isready -U tsmyadmin -d tsmyadmin_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Load fixtures
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client postgresql-client >/dev/null
          mysql -h 127.0.0.1 -P 13306 -uroot -proot < docker/fixtures/mysql/01-schema.sql
          PGPASSWORD=tsmyadmin psql -h 127.0.0.1 -p 15433 -U tsmyadmin -d tsmyadmin_test -v ON_ERROR_STOP=1 -f docker/fixtures/postgres/01-schema.sql
      - run: bunx playwright install --with-deps chromium webkit
      # The Playwright webServer command builds the SPA itself.
      # Visual regression baselines are platform-specific (fonts) and maintained locally; CI runs functional + a11y
      # on Chromium and the functional specs on WebKit (Safari's focus, cookie and input behaviour differ).
      - run: bunx playwright test --project=chromium --project=a11y --project=webkit
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    # Quality signal only: budgets are asserted at "warn" level and never block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lighthouse
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run size
      - run: docker build -t tsmyadmin:ci .
