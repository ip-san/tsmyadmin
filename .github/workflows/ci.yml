name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        task: [typecheck, lint, test, quality]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: typecheck
        if: matrix.task == 'typecheck'
        run: bun run typecheck && bun run type-coverage
      - name: lint
        if: matrix.task == 'lint'
        run: bun run lint
      - name: test
        if: matrix.task == 'test'
        run: bun run test
      - name: quality
        if: matrix.task == 'quality'
        run: bun run knip && bun run circular && bun run cpd && bun run check:arch && bun run check:sql-safety && bun run docs:validate

  integration:
    runs-on: ubuntu-latest
    needs: check
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tsmyadmin_test
          MYSQL_USER: tsmyadmin
          MYSQL_PASSWORD: tsmyadmin
        ports: ["13306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tsmyadmin
          POSTGRES_PASSWORD: tsmyadmin
          POSTGRES_DB: tsmyadmin_test
        ports: ["15433:5432"]
        options: >-
          --health-cmd "pg_isready -U tsmyadmin -d tsmyadmin_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Load fixtures
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client postgresql-client >/dev/null
          mysql -h 127.0.0.1 -P 13306 -uroot -proot < docker/fixtures/mysql/01-schema.sql
          PGPASSWORD=tsmyadmin psql -h 127.0.0.1 -p 15433 -U tsmyadmin -d tsmyadmin_test -v ON_ERROR_STOP=1 -f docker/fixtures/postgres/01-schema.sql
      - run: bun run test:integration

  # The MySQL adapter must also pass its conformance suite against MariaDB (mysql.user layout, max_statement_time…).
  integration-mariadb:
    runs-on: ubuntu-latest
    needs: check
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: tsmyadmin_test
          MARIADB_USER: tsmyadmin
          MARIADB_PASSWORD: tsmyadmin
        ports: ["13306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Load fixtures
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mariadb-client >/dev/null
          mariadb -h 127.0.0.1 -P 13306 -uroot -proot < docker/fixtures/mysql/01-schema.sql
      - run: INTEGRATION=1 bunx vitest run --project adapter-integration packages/adapter/src/test/mysql.integration.test.ts

  e2e:
    runs-on: ubuntu-latest
    needs: check
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tsmyadmin_test
          MYSQL_USER: tsmyadmin
          MYSQL_PASSWORD: tsmyadmin
        ports: ["13306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tsmyadmin
          POSTGRES_PASSWORD: tsmyadmin
          POSTGRES_DB: tsmyadmin_test
        ports: ["15433:5432"]
        options: >-
          --health-cmd "pg_isready -U tsmyadmin -d tsmyadmin_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Load fixtures
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mysql-client postgresql-client >/dev/null
          mysql -h 127.0.0.1 -P 13306 -uroot -proot < docker/fixtures/mysql/01-schema.sql
          PGPASSWORD=tsmyadmin psql -h 127.0.0.1 -p 15433 -U tsmyadmin -d tsmyadmin_test -v ON_ERROR_STOP=1 -f docker/fixtures/postgres/01-schema.sql
      - run: bunx playwright install --with-deps chromium
      - run: bun run build
      # Visual regression baselines are platform-specific (fonts) and maintained locally; CI runs functional + a11y.
      - run: bunx playwright test --project=chromium --project=a11y
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  lighthouse:
    runs-on: ubuntu-latest
    needs: check
    # Quality signal only: budgets are asserted at "warn" level and never block a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run lighthouse
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run size
      - run: docker build -t tsmyadmin:ci .
